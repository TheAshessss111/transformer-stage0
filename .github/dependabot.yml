version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Grouped so a month of updates is one PR through the gate, not fifteen.
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
